name: Test Webview Client

on: pull_request

defaults:
  run:
    working-directory: ./refl1d/webview/client

jobs:
  # test that app can build without issues
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout bumps source
        uses: actions/checkout@v7
        with:
          repository: bumps/bumps
          sparse-checkout: "bumps/webview/client"
          path: bumps

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: Use bumps code from source
        run: |
          cd ../../../bumps/bumps/webview/client
          bun install
          bun link
          cd ../../../../refl1d/webview/client
          bun link bumps-webview-client

      - name: Run test
        run: bun run build

  # Test that app is properly linted
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: Run test
        run: bun run test:lint

  # Test that app is properly formatted
  test-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: Run test
        run: bun run test:format

  # test that app has no typescript errors
  test-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout bumps source
        uses: actions/checkout@v7
        with:
          repository: bumps/bumps
          sparse-checkout: "bumps/webview/client"
          path: bumps

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: Use bumps code from source
        run: |
          cd ../../../bumps/bumps/webview/client
          bun install
          bun link
          cd ../../../../refl1d/webview/client
          bun link bumps-webview-client

      - name: Run test
        run: bun run test:types

  # Run unit and component tests
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout bumps source
        uses: actions/checkout@v7
        with:
          repository: bumps/bumps
          sparse-checkout: "bumps/webview/client"
          path: bumps

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: Use bumps code from source
        run: |
          cd ../../../bumps/bumps/webview/client
          bun install
          bun link
          cd ../../../../refl1d/webview/client
          bun link bumps-webview-client

      - name: Run test
        run: bun run test:unit

  # Run end-to-end tests against the real Python server
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versioningit needs tags to install refl1d

      # the whole repository, since the server runs this bumps too
      - name: Checkout bumps source
        uses: actions/checkout@v7
        with:
          repository: bumps/bumps
          path: bumps
          fetch-depth: 0 # versioningit needs tags to install bumps

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # the server uses the same bumps as the client, rather than the pinned release
      - name: Install refl1d and bumps
        working-directory: .
        run: |
          echo "bumps @ $GITHUB_WORKSPACE/bumps" > bumps-override.txt
          uv venv
          uv pip install -e . --override bumps-override.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: Use bumps code from source
        run: |
          cd ../../../bumps/bumps/webview/client
          bun install
          bun link
          cd ../../../../refl1d/webview/client
          bun link bumps-webview-client

      - name: Install browser
        run: bunx playwright install --with-deps chromium

      - name: Run test
        run: bun run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: refl1d/webview/client/playwright-report/
